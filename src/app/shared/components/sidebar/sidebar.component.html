<div class="container-fluid">
  <div class="row flex-nowrap">
    <div class="col-auto col-md-3 col-xl-2 px-sm-2 px-0 bg-dark">
      <div
        class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark min-vh-100"
      >
        <div class="dropdown pb-1">
          <a
            href="#"
            class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
            id="dropdownUser1"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <img
              src="images/user-avatar.png"
              alt="hugenerd"
              width="30"
              height="30"
              class="rounded-circle"
            />
            <div
              class="ms-2 d-none d-sm-inline text-truncate"
              *ngIf="currentUser$ | async as profile"
            >
              <p class="d-none d-sm-inline mx-auto text-wrap">
                {{ profile.email }}
              </p>
              <p class="mx-1 text-center">{{ profile.roles }}</p>
            </div>
          </a>
          <ul class="dropdown-menu dropdown-menu-dark text-small shadow">

            <li><a class="dropdown-item" href="#">Settings</a></li>

              <hr class="dropdown-divider" />

            <li>
              <a
                class="dropdown-item"
                routerLink="/auth/login"
                (click)="logOut()"
                >Sign out</a
              >
            </li>
          </ul>
        </div>
        <hr />
        <ul class="nav nav-pills flex-column mb-auto sticky-top" id="menu">
          <li *hasRole="'ADMIN'" class="nav-item">
            <a class="nav-link text-white" routerLink="/main-menu">
              <i class="fs-4 bi-house"></i>
              <span class="ms-1 d-none d-sm-inline">Home</span>
            </a>
          </li>
          <li>
            <a
              class="nav-link text-white"

            >
              <i class="fs-4 bi bi-cart4"></i>

            >
          </li>

            <a

            <a

            </a>
          </li>
          <li *hasRole="'ADMIN'">
            <a

              routerLink="/under-construction"

              <i class="fs-4 bi-people"></i>
