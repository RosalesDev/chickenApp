<nav class="navbar fixed-top navbar-light bg-light">
  <div class="container-fluid">
    <span class="navbar-brand fw-bold text-info"> ChickenApp </span>
    <div class="dropdown">
      <button
        class="btn btn-outline-info border-0"
        type="button"
        data-bs-toggle="dropdown"
        aria-expanded="false"
        aria-label="Toggle user menu"
      >
        <i class="bi bi-person-circle fs-3"></i>
      </button>

      <ul class="dropdown-menu dropdown-menu-end">
        <li>
          <button class="dropdown-item d-flex align-items-center" type="button">
            <i class="bi bi-box-arrow-right me-2"></i>
            Cerrar Sesión
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>
<div class="menu-container container-fluid py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h1 class="display-5 fw-bold">Panel de Navegación</h1>
      <p class="lead text-muted">
        Selecciona una opción para comenzar a gestionar tu negocio.
      </p>
    </div>

    <div class="row g-4 justify-content-center">
      <div
        *ngFor="let option of menuOptions; let i = index"
        class="col-12 col-sm-6 col-lg-3 d-flex align-items-stretch"
        [style.animation-delay]="i * 100 + 'ms'"
      >
        <a
          [routerLink]="option.route"
          class="menu-card text-decoration-none w-100"
        >
          <div class="card-body text-center">
            <i class="menu-icon {{ option.icon }}"></i>
            <h3 class="card-title mt-3 mb-0">{{ option.title }}</h3>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
